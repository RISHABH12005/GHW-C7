name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Compile Python files
        run: python -m compileall -q setup_db.py ingest.py

      - name: Check required project files
        run: |
          test -s README.md
          test -s setup_db.py
          test -s ingest.py
          test -s sql/analytics.sql
          test -s .env.example
